spring.application.name=springBootTest
spring.profiles.active=dev

# ===== MySQL 数据源 =====
spring.datasource.url=jdbc:mysql://localhost:3306/yuqing_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=yuqing
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.banner=false

# ===== JWT 登录令牌 =====
# 密钥至少 32 字节（HS256），生产环境务必换成随机值并放到环境变量里
app.jwt.secret=yuqing-sakura-portal-jwt-secret-2026-please-change-in-prod
# 记住我：7 天；不勾选：12 小时（毫秒）
app.jwt.expire-remember=604800000
app.jwt.expire-session=43200000

